services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ctfgame
      POSTGRES_USER: ctf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в файле .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Только для локального доступа (DBeaver, dotnet run). Наружу порт не открыт.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf -d ctfgame"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=ctfgame;Username=ctf;Password=${POSTGRES_PASSWORD}"
      Admin__UserName: ${ADMIN_USERNAME:-admin}
      Admin__Password: ${ADMIN_PASSWORD:-}
      TZ: ${TZ:-UTC}
    volumes:
      - dpkeys:/home/app/.aspnet/DataProtection-Keys
    ports:
      - "${APP_PORT:-5080}:8080"

volumes:
  pgdata:
  dpkeys:
